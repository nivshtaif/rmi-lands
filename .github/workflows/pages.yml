name: Deploy map to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  # The monitor commits the regenerated map using GITHUB_TOKEN, and GitHub does
  # not raise push events for token pushes — so the push trigger above never
  # fires for them. Deploy off the monitor's completion instead, otherwise the
  # published map silently stops tracking the snapshot.
  workflow_run:
    workflows: ["RMI Tender Monitor"]
    types: [completed]
  workflow_dispatch:   # Manual trigger

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Don't publish off a monitor run that failed — it may not have written a
    # map at all. Other triggers are unconditional.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # enablement:true turns Pages on via the API, so no manual setup is
      # needed before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
